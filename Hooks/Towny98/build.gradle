group 'Hooks:Towny98'

dependencies {
    compileOnly "com.palmergames:Towny:0.98.0.0"
    compileOnly "org.spigotmc:v1_8_R3-Taco:latest"
    compileOnly project(":API")
    compileOnly project(":")
}

if (project.hasProperty('hook.compile_towny98') &&
        !Boolean.valueOf(project.findProperty("hook.compile_towny98").toString())) {
    project.tasks.all { task -> task.enabled = false }
}
